name: Host range tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flash-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Test documented Flash ranges
        run: python3 -m unittest discover -s tests -v

  c-block-validator:
    name: C validator (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Compile and run portable block validator
        run: |
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic \
            -I include src/ota_block_validator.c tests/test_ota_block_validator.c \
            -o ota_block_validator_test
          ./ota_block_validator_test
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic \
            -I include src/ota_image.c tests/test_ota_image.c -o ota_image_test
          ./ota_image_test
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic \
            -I include -I host_tools src/ota_flash.c host_tools/ota_flash_sim.c \
            tests/test_ota_flash.c -o ota_flash_test
          ./ota_flash_test
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic \
            -I include -I host_tools src/ota_block_validator.c src/ota_image.c \
            src/ota_flash.c src/ota_update.c host_tools/ota_flash_sim.c \
            tests/test_ota_update.c -o ota_update_test
          ./ota_update_test
          ${{ matrix.compiler }} -std=c11 -Wall -Wextra -Werror -pedantic \
            -I include -I host_tools src/ota_block_validator.c src/ota_image.c \
            src/ota_flash.c src/ota_update.c host_tools/ota_flash_sim.c \
            tools/ota_host_demo.c -o ota_host_demo
          ./ota_host_demo normal
          ./ota_host_demo corrupt
          ./ota_host_demo recovery

  c-block-sanitizers:
    name: C validator (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Compile and run under sanitizer
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -fsanitize=${{ matrix.sanitizer }} \
            -I include src/ota_block_validator.c tests/test_ota_block_validator.c \
            -o ota_block_validator_test
          ./ota_block_validator_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -fsanitize=${{ matrix.sanitizer }} \
            -I include src/ota_image.c tests/test_ota_image.c -o ota_image_test
          ./ota_image_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -fsanitize=${{ matrix.sanitizer }} \
            -I include -I host_tools src/ota_flash.c host_tools/ota_flash_sim.c \
            tests/test_ota_flash.c -o ota_flash_test
          ./ota_flash_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -fsanitize=${{ matrix.sanitizer }} \
            -I include -I host_tools src/ota_block_validator.c src/ota_image.c \
            src/ota_flash.c src/ota_update.c host_tools/ota_flash_sim.c \
            tests/test_ota_update.c -o ota_update_test
          ./ota_update_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -g -O1 \
            -fno-omit-frame-pointer -fno-sanitize-recover=all \
            -fsanitize=${{ matrix.sanitizer }} \
            -I include -I host_tools src/ota_block_validator.c src/ota_image.c \
            src/ota_flash.c src/ota_update.c host_tools/ota_flash_sim.c \
            tools/ota_host_demo.c -o ota_host_demo
          ./ota_host_demo normal
          ./ota_host_demo corrupt
          ./ota_host_demo recovery
