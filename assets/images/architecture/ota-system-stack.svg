<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
  <title id="title">Embedded OTA Update System Stack</title>
  <desc id="desc">Local UART YMODEM IAP and network MQTT OTA are separate transport paths. Both lead to internal Flash update mechanics, Bootloader control, and fixed-address application handoff.</desc>
  <rect width="1040" height="720" rx="24" fill="#f6f8fa"/>
  <style>
    .box{fill:#fff;stroke:#57606a;stroke-width:2}.local{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.network{fill:#dafbe1;stroke:#1a7f37;stroke-width:2}.boundary{fill:#fff8c5;stroke:#9a6700;stroke-width:2}
    .title{font:700 24px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24292f}.text{font:600 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24292f}.sub{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#57606a}.arrow{stroke:#57606a;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#57606a"/></marker></defs>
  <text x="520" y="43" text-anchor="middle" class="title">Embedded Firmware Update Stack</text>

  <rect x="90" y="72" width="360" height="70" rx="12" class="local"/>
  <text x="270" y="102" text-anchor="middle" class="text">Local Firmware File</text>
  <text x="270" y="126" text-anchor="middle" class="sub">UART / YMODEM IAP source</text>

  <rect x="590" y="72" width="360" height="70" rx="12" class="network"/>
  <text x="770" y="102" text-anchor="middle" class="text">Aliyun OTA Metadata / Blocks</text>
  <text x="770" y="126" text-anchor="middle" class="sub">network OTA source</text>

  <path d="M270 142V174" class="arrow"/><path d="M770 142V174" class="arrow"/>

  <rect x="90" y="176" width="360" height="78" rx="12" class="local"/>
  <text x="270" y="207" text-anchor="middle" class="text">UART / YMODEM Transport</text>
  <text x="270" y="232" text-anchor="middle" class="sub">packet sequence · CRC-16/XMODEM</text>

  <rect x="590" y="176" width="360" height="78" rx="12" class="network"/>
  <text x="770" y="207" text-anchor="middle" class="text">ESP8266 AT / MQTT Transport</text>
  <text x="770" y="232" text-anchor="middle" class="sub">metadata · block request · CRC-16/IBM</text>

  <path d="M270 254V298" class="arrow"/><path d="M770 254V298" class="arrow"/>

  <rect x="90" y="300" width="360" height="82" rx="12" class="box"/>
  <text x="270" y="333" text-anchor="middle" class="text">Direct IAP Flash Write</text>
  <text x="270" y="358" text-anchor="middle" class="sub">Application at 0x08004000</text>

  <rect x="590" y="300" width="360" height="82" rx="12" class="box"/>
  <text x="770" y="333" text-anchor="middle" class="text">OTA Control &amp; Staging Flash</text>
  <text x="770" y="358" text-anchor="middle" class="sub">update flag · staging → active copy</text>

  <path d="M270 382V432H520" class="arrow"/><path d="M770 382V432H520" class="arrow"/>

  <rect x="260" y="434" width="520" height="76" rx="12" class="box"/>
  <text x="520" y="466" text-anchor="middle" class="text">Internal Flash Update Mechanics</text>
  <text x="520" y="491" text-anchor="middle" class="sub">erase / program · fixed partition addresses</text>

  <path d="M520 510V542" class="arrow"/>
  <rect x="260" y="544" width="520" height="72" rx="12" class="local"/>
  <text x="520" y="575" text-anchor="middle" class="text">Bootloader &amp; Application Handoff</text>
  <text x="520" y="600" text-anchor="middle" class="sub">initial MSP · Reset Vector · VTOR-compatible link address</text>

  <rect x="800" y="434" width="210" height="182" rx="12" class="boundary"/>
  <text x="905" y="468" text-anchor="middle" class="text">Current Boundary</text>
  <text x="905" y="500" text-anchor="middle" class="sub">no signature</text>
  <text x="905" y="526" text-anchor="middle" class="sub">no encryption</text>
  <text x="905" y="552" text-anchor="middle" class="sub">no A/B boot</text>
  <text x="905" y="578" text-anchor="middle" class="sub">no rollback</text>

  <text x="520" y="676" text-anchor="middle" class="sub">IAP and network OTA use different transports but share Bootloader and Flash-update foundations.</text>
</svg>
