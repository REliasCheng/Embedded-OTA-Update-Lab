<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Firmware update pipeline</title><desc id="desc">A firmware source branches into independent UART YMODEM and MQTT transports, then converges on Flash staging or application storage, CRC error detection, and boot handoff.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 16px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="470" rx="22"/><path class="grid" d="M0 105H1200M0 370H1200M300 0V470M600 0V470M900 0V470"/>
  <text class="title" x="50" y="52">Firmware Update Pipeline</text><text class="sub" x="50" y="82">Independent transports · explicit Flash model · CRC boundary · boot handoff</text>
  <rect class="box input" x="45" y="205" width="190" height="86" rx="14"/><text class="label" x="140" y="239">Firmware Source</text><text class="detail" x="140" y="266">image / block</text>
  <rect class="box core" x="315" y="135" width="210" height="86" rx="14"/><text class="label" x="420" y="169">UART / YMODEM</text><text class="detail" x="420" y="196">local IAP path</text>
  <rect class="box core" x="315" y="285" width="210" height="86" rx="14"/><text class="label" x="420" y="319">MQTT Transport</text><text class="detail" x="420" y="346">network block path</text>
  <rect class="box hardware" x="610" y="205" width="210" height="86" rx="14"/><text class="label" x="715" y="239">Flash / Staging</text><text class="detail" x="715" y="266">fixed regions</text>
  <rect class="box core" x="895" y="135" width="210" height="86" rx="14"/><text class="label" x="1000" y="169">CRC Check</text><text class="detail" x="1000" y="196">error detection</text>
  <rect class="box output" x="895" y="285" width="210" height="86" rx="14"/><text class="label dark" x="1000" y="319">Boot Handoff</text><text class="detail dark" x="1000" y="346">MSP · vector</text>
  <path class="arrow" d="M235 235L315 178M235 261L315 328M525 178L610 232M525 328L610 264M820 248L895 190M1000 221V285"/>
  <text class="detail" x="715" y="414">Staging is not Slot B · CRC is not authentication or encryption</text>
</svg>
